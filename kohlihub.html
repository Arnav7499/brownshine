/* ============================== HELPERS ============================== */
function safeGet(key, fallback){
  try{
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function safeSet(key, value){
  try{ window.localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* ignore */ }
}

function parseHash(){
  let h = window.location.hash.replace(/^#\/?/, "");
  if(!h) return { page:"home", param:null };
  const parts = h.split("/").filter(Boolean);
  if(parts[0] === "shots" && parts[1]) return { page:"shot", param:parts[1] };
  if(parts[0] === "highlight" && parts[1]) return { page:"highlight", param:parts[1] };
  if(parts[0] === "best-innings") return { page:"best-innings", param:null };
  if(parts[0] === "about") return { page:"about", param:null };
  if(parts[0] === "favorites") return { page:"favorites", param:null };
  if(parts[0] === "recent") return { page:"recent", param:null };
  if(parts[0] === "settings") return { page:"settings", param:null };
  return { page:"home", param:null };
}
function useRoute(){
  const [route, setRoute] = useState(parseHash());
  useEffect(()=>{
    const onChange = () => setRoute(parseHash());
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  },[]);
  return route;
}
function navigate(hash){
  window.location.hash = hash;
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ============================== APP CONTEXT (favorites / recent) ============================== */
const AppCtx = createContext(null);
function AppProvider({ children }){
  const [favorites, setFavorites] = useState(() => safeGet("kh_favorites", []));
  const [recent, setRecent] = useState(() => safeGet("kh_recent", []));

  const toggleFavorite = useCallback((id) => {
    setFavorites(prev => {
      const next = prev.includes(id) ? prev.filter(x=>x!==id) : [id, ...prev];
      safeSet("kh_favorites", next);
      return next;
    });
  },[]);
  const isFavorite = useCallback((id) => favorites.includes(id), [favorites]);
  const addRecent = useCallback((id) => {
    setRecent(prev => {
      const next = [id, ...prev.filter(x=>x!==id)].slice(0, 12);
      safeSet("kh_recent", next);
      return next;
    });
  },[]);

  return (
    <AppCtx.Provider value={{ favorites, toggleFavorite, isFavorite, recent, addRecent }}>
      {children}
    </AppCtx.Provider>
  );
}
const useApp = () => useContext(AppCtx);

/* ============================== SEARCH MODAL ============================== */
function SearchModal({ open, onClose }){
  const [q, setQ] = useState("");
  const inputRef = useRef(null);
  useEffect(()=>{ if(open){ setQ(""); setTimeout(()=>inputRef.current && inputRef.current.focus(), 60); } },[open]);
  useEffect(()=>{
    const onKey = (e) => { if(e.key === "Escape") onClose(); };
    if(open) window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  },[open,onClose]);

  const results = useMemo(()=>{
    const term = q.trim().toLowerCase();
    if(!term) return [];
    return HIGHLIGHTS.filter(h =>
      h.title.toLowerCase().includes(term) ||
      h.opponent.toLowerCase().includes(term) ||
      String(h.year).includes(term) ||
      h.format.toLowerCase().includes(term) ||
      h.match.toLowerCase().includes(term) ||
      shotLabel(h.shotType).toLowerCase().includes(term)
    );
  },[q]);

  if(!open) return null;
  return (
    <div className="fixed inset-0 z-50">
      <div className="absolute inset-0 scrim-enter" style={{ background:"rgba(0,0,0,0.65)" }} onClick={onClose} />
      <div className="absolute inset-x-0 top-0 md:top-16 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[560px] modal-enter">

          <div className="flex items-center gap-3 px-4 h-14 border-b" style={{ borderColor:"var(--border-soft)" }}>
            <SearchIcon size={19} style={{ color:"var(--text-dim)" }} />
            <input
              ref={inputRef}
              value={q}
              onChange={e=>setQ(e.target.value)}
              placeholder="Search shot, opponent, year, format..."
              className="flex-1 bg-transparent outline-none text-[15px]"
              style={{ color:"var(--text)" }}
            />
            <button aria-label="Close search" onClick={onClose} className="focus-ring p-1.5 rounded-lg hover:bg-white/5">
              <XIcon size={18} style={{ color:"var(--text-dim)" }} />
            </button>
          </div>
          <div className="max-h-[62vh] overflow-y-auto p-3">
            {q.trim() === "" && (
              <div className="px-2 py-6 text-center text-[13px]" style={{ color:"var(--text-faint)" }}>
                Try "cover drive", "Australia", "2016", or "ODI"
              </div>
            )}

              <div className="px-2 py-10 text-center">
                <p className="text-[14px] font-semibold" style={{ color:"var(--text)" }}>No highlights found</p>
                <p className="text-[12.5px] mt-1" style={{ color:"var(--text-faint)" }}>Try a different shot, opponent, or year.</p>
              </div>
            )}
            <div className="grid grid-cols-1 gap-1">
              {results.map(h => (
                <a key={h.id} href={"#/highlight/"+h.id} onClick={onClose}
                   className="flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 transition-colors">
                  <div className="relative w-16 h-10 rounded-lg overflow-hidden shrink-0">
                    <ThumbArt shotType={h.shotType} />

function youTubeEmbedUrl(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return "https://www.youtube.com/embed/"+u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")){
      const vid = u.searchParams.get("v");
      if(vid) return "https://www.youtube.com/embed/"+vid;
      if(u.pathname.startsWith("/embed/")) return url;
    }
  }catch(e){ /* not a valid URL */ }
  return null;
}

function VideoPlayer({ h }){
  const [playing, setPlaying] = useState(false);

  const ytEmbed = url ? youTubeEmbedUrl(url) : null;

    );
  }

  if(ytEmbed){
    return (
      <div className="relative w-full rounded-2xl overflow-hidden border" style={{ aspectRatio:"16/9", borderColor:"var(--border)" }}>
        <iframe
          src={ytEmbed}
          title={h.title}
          className="absolute inset-0 w-full h-full"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowFullScreen
        />
      </div>
    );
  }

  if(isDirectFile){
    return (
      <div className="relative w-full rounded-2xl overflow-hidden border bg-black" style={{ aspectRatio:"16/9", borderColor:"var(--border)" }}>
        <video
          className="absolute inset-0 w-full h-full"
          src={url}
          controls
          playsInline
          poster=""
        />
      </div>
    );
  }

  // videoUrl set but not a recognizable format — fall back to placeholder with a note.
  return (
    <div className="relative w-full rounded-2xl overflow-hidden border" style={{ aspectRatio:"16/9", borderColor:"var(--border)" }}>
      <ThumbArt shotType={h.shotType} size="lg" />

  );

      <div className="max-w-6xl mx-auto px-4 py-16 text-center">
        <p className="display text-2xl mb-2" style={{ color:"var(--text)" }}>Highlight not found</p>
        <a href="#/" className="text-[13px] font-semibold" style={{ color:"var(--orange)" }}>Back to home</a>
      </div>
    );
  }
  const related = HIGHLIGHTS.filter(x=>x.shotType===h.shotType && x.id!==h.id).slice(0,4);

  return (
    <div className="max-w-6xl mx-auto px-4 pt-4 pb-16 fade-in">
      <button onClick={()=>window.history.length>1 ? window.history.back() : navigate("#/")}
              className="focus-ring flex items-center gap-1 text-[13px] font-medium mb-4 hover:text-[var(--orange)] transition-colors"
              style={{ color:"var(--text-dim)" }}>
        <ChevronLeft size={16} /> Back
      </button>

      <VideoPlayer h={h} />

      <div className="mt-5 flex items-start justify-between gap-4">
        <div>
          <div className="flex items-center gap-2 mb-2">
            <Badge>{shotLabel(h.shotType)}</Badge>
            <Badge tone="neutral">{h.format}</Badge>
          </div>
          <h1 className="display text-[22px] md:text-[30px]" style={{ color:"var(--text)" }}>{h.title}</h1>
        </div>
        <FavoriteButton id={h.id} size={24} className="mt-1 shrink-0" />
      </div>

      <div className="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-[13px]">
        {[["Match", h.match], ["Opponent", h.opponent], ["Year", h.year], ["Duration", h.duration]].map(([k,v]) => (
          <div key={k} className="rounded-xl border px-3 py-2.5" style={{ background:"var(--card)", borderColor:"var(--border)" }}>
            <p className="text-[11px]" style={{ color:"var(--text-faint)" }}>{k}</p>
            <p className="font-medium mt-0.5" style={{ color:"var(--text)" }}>{v}</p>
          </div>
        ))}
      </div>

      <p className="mt-5 text-[14px] leading-relaxed max-w-2xl" style={{ color:"var(--text-dim)" }}>{h.description}</p>

      {related.length > 0 && (
        <div className="mt-10">
          <SectionHeading title="More Kohli Moments" />
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {related.map(r => <HighlightCard key={r.id} h={r} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function BestInningsPage(){
  return (
    <div className="max-w-6xl mx-auto px-4 pt-6 pb-16 fade-in">
      <h1 className="display text-[26px] md:text-[36px]" style={{ color:"var(--text)" }}>Best Innings</h1>
      <p className="text-[13.5px] md:text-[14.5px] mt-2 max-w-xl" style={{ color:"var(--text-dim)" }}>
        A curated set of memorable Virat Kohli innings across formats. Figures shown are sample/reference data for this demo.
      </p>
      <div className="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        {BEST_INNINGS.map(inn => (
          <div key={inn.id} className="rounded-2xl overflow-hidden border flex flex-col sm:flex-row" style={{ background:"var(--card)", borderColor:"var(--border)" }}>
            <div className="relative sm:w-40 shrink-0" style={{ aspectRatio: "16/10" }}>
              <ThumbArt shotType={inn.shotType} />
              <div className="absolute top-2 left-2"><TrophyIcon size={16} className="text-white/80" /></div>
            </div>
            <div className="p-4 flex-1">
              <p className="text-[11px] font-semibold tracking-wide" style={{ color:"var(--orange-hot)" }}>VIRAT KOHLI</p>
              <p className="display text-[30px] leading-none mt-1" style={{ color:"var(--text)" }}>{inn.score}</p>
              <p className="text-[13px] mt-1.5" style={{ color:"var(--text-dim)" }}>vs {inn.opponent} · {inn.format} · {inn.year}</p>
              <p className="text-[12.5px] mt-2 leading-relaxed" style={{ color:"var(--text-faint)" }}>{inn.context}</p>
              <a href={"#/shots/"+inn.shotType} className="focus-ring inline-flex items-center gap-1 mt-3 text-[12.5px] font-semibold" style={{ color:"var(--orange)" }}>
                Watch Highlights <ChevronRight size={14} />
              </a>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AboutPage(){
  return (
    <div className="max-w-3xl mx-auto px-4 pt-6 pb-16 fade-in">
      <h1 className="display text-[26px] md:text-[36px]" style={{ color:"var(--text)" }}>About KohliHub</h1>
      <p className="text-[14px] mt-3 leading-relaxed" style={{ color:"var(--text-dim)" }}>
        KohliHub is a fan-made project created to organize and explore memorable Virat Kohli batting moments by shot type.
      </p>

      <div className="mt-8 space-y-8">
        <div>
          <h2 className="display text-[18px] mb-2" style={{ color:"var(--text)" }}>Popular Shots</h2>
          <p className="text-[13.5px] leading-relaxed" style={{ color:"var(--text-dim)" }}>
            Browse highlights grouped by cover drive, pull shot, flick shot, straight drive, on drive, square cut, late cut, and sweep shot — each with its own dedicated page.
          </p>
        </div>
        <div>
          <h2 className="display text-[18px] mb-2" style={{ color:"var(--text)" }}>How It Works</h2>
          <p className="text-[13.5px] leading-relaxed" style={{ color:"var(--text-dim)" }}>
            This is a demo/reference build: highlight details, match data, and thumbnails shown here are sample content used to illustrate the product experience, not licensed footage or verified statistics.
          </p>
        </div>
        <div>
          <h2 className="display text-[18px] mb-2" style={{ color:"var(--text)" }}>Media Rights &amp; Disclaimer</h2>
          <p className="text-[13.5px] leading-relaxed" style={{ color:"var(--text-dim)" }}>
            KohliHub is an unofficial fan project and is not affiliated with Virat Kohli, BCCI, ICC, or any broadcaster. All media rights belong to their respective owners.
          </p>
        </div>
      </div>
    </div>
  );
}

function EmptyState({ title, subtitle, cta }){
  return (
    <div className="py-16 text-center">
      <p className="display text-[20px] mb-1.5" style={{ color:"var(--text)" }}>{title}</p>
      <p className="text-[13px] mb-5" style={{ color:"var(--text-faint)" }}>{subtitle}</p>
      {cta}
    </div>
  );
}

function FavoritesPage(){
  const { favorites } = useApp();
  const list = HIGHLIGHTS.filter(h => favorites.includes(h.id));
  return (
    <div className="max-w-6xl mx-auto px-4 pt-6 pb-16 fade-in">
      <h1 className="display text-[24px] md:text-[32px]" style={{ color:"var(--text)" }}>My Favorites</h1>
      <p className="text-[13.5px] mt-1.5" style={{ color:"var(--text-dim)" }}>Highlights you've saved on this device.</p>
      {list.length === 0 ? (
        <EmptyState title="No favorites yet" subtitle="Tap the heart icon on any highlight to save it here."
          cta={<a href="#/" className="focus-ring px-5 py-2.5 rounded-xl text-[13.5px] font-semibold" style={{ background:"var(--orange)", color:"#0A0A0B" }}>Browse highlights</a>} />
      ) : (
        <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
          {list.map(h => <HighlightCard key={h.id} h={h} />)}
        </div>
      )}
    </div>
  );
}

function RecentPage(){
  const { recent } = useApp();
  const list = recent.map(id => HIGHLIGHTS.find(h=>h.id===id)).filter(Boolean);
  return (
    <div className="max-w-6xl mx-auto px-4 pt-6 pb-16 fade-in">
      <h1 className="display text-[24px] md:text-[32px]" style={{ color:"var(--text)" }}>Recently Watched</h1>
      <p className="text-[13.5px] mt-1.5" style={{ color:"var(--text-dim)" }}>Highlights you've opened recently on this device.</p>
      {list.length === 0 ? (
        <EmptyState title="Nothing watched yet" subtitle="Open a highlight and it will show up here."
          cta={<a href="#/" className="focus-ring px-5 py-2.5 rounded-xl text-[13.5px] font-semibold" style={{ background:"var(--orange)", color:"#0A0A0B" }}>Browse highlights</a>} />
      ) : (
        <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
          {list.map(h => <HighlightCard key={h.id} h={h} />)}
        </div>
      )}
    </div>
  );
}

function SettingsPage(){
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-theme") || "dark");
  const [autoplay, setAutoplay] = useState(() => safeGet("kh_autoplay", false));
  useEffect(()=>{ document.documentElement.setAttribute("data-theme", theme); safeSet("kh_theme", theme); },[theme]);
  useEffect(()=>{ safeSet("kh_autoplay", autoplay); },[autoplay]);

  const Toggle = ({ checked, onChange }) => (
    <button onClick={()=>onChange(!checked)} className="focus-ring w-11 h-6 rounded-full relative transition-colors"
      style={{ background: checked ? "var(--orange)" : "var(--border)" }}>
      <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: checked ? "22px" : "2px" }} />
    </button>
  );

  return (
    <div className="max-w-2xl mx-auto px-4 pt-6 pb-16 fade-in">
      <h1 className="display text-[24px] md:text-[32px]" style={{ color:"var(--text)" }}>Settings</h1>
      <p className="text-[13.5px] mt-1.5" style={{ color:"var(--text-dim)" }}>Preferences are stored on this device only.</p>

      <div className="mt-6 rounded-2xl border divide-y" style={{ background:"var(--card)", borderColor:"var(--border)" }}>
        <div className="flex items-center justify-between px-4 py-4">
          <div>
            <p className="text-[13.5px] font-medium" style={{ color:"var(--text)" }}>Dark theme</p>
            <p className="text-[12px]" style={{ color:"var(--text-faint)" }}>Switch between dark and light appearance</p>
          </div>
          <Toggle checked={theme==="dark"} onChange={(v)=>setTheme(v?"dark":"light")} />
        </div>
        <div className="flex items-center justify-between px-4 py-4" style={{ borderColor:"var(--border-soft)" }}>
          <div>
            <p className="text-[13.5px] font-medium" style={{ color:"var(--text)" }}>Autoplay on open</p>
            <p className="text-[12px]" style={{ color:"var(--text-faint)" }}>Start playback automatically on a highlight page</p>
          </div>
          <Toggle checked={autoplay} onChange={setAutoplay} />
        </div>
      </div>
    </div>
  );
}

/* ============================== FOOTER ============================== */
function Footer(){
  return (
    <footer className="border-t mt-6" style={{ borderColor:"var(--border-soft)", background:"var(--bg-raised)" }}>
      <div className="max-w-6xl mx-auto px-4 py-10">
        <Logo />
        <p className="text-[12.5px] mt-3 max-w-sm" style={{ color:"var(--text-dim)" }}>
          An unofficial fan-made collection of Virat Kohli batting moments.
        </p>
        <div className="mt-5 flex flex-wrap gap-x-6 gap-y-2 text-[12.5px] font-medium">
          {[["Home","#/"],["Popular Shots","#/shots/cover-drive"],["Best Innings","#/best-innings"],["About","#/about"],["Contact","#/about"]].map(([l,h])=>(
            <a key={l} href={h} className="focus-ring hover:text-[var(--orange)] transition-colors" style={{ color:"var(--text-dim)" }}>{l}</a>
          ))}
        </div>
        <p className="text-[11px] mt-6 pt-6 border-t leading-relaxed max-w-xl" style={{ color:"var(--text-faint)", borderColor:"var(--border-soft)" }}>
          KohliHub is an unofficial fan project and is not affiliated with Virat Kohli, BCCI, ICC, or any broadcaster. All media rights belong to their respective owners.
        </p>
      </div>
    </footer>
  );
}

/* ============================== APP ROOT ============================== */
function App(){
  const route = useRoute();
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);

  useEffect(()=>{
    const saved = safeGet("kh_theme", null);
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  },[]);

  const activeCategory = route.page === "shot" ? route.param : (route.page === "home" ? "all" : null);
  const showCategoryNav = route.page === "home" || route.page === "shot";

  let page;
  if(route.page === "home") page = <HomePage />;
  else if(route.page === "shot") page = <ShotPage shotId={route.param} />;
  else if(route.page === "highlight") page = <HighlightDetailPage id={route.param} />;
  else if(route.page === "best-innings") page = <BestInningsPage />;
  else if(route.page === "about") page = <AboutPage />;
  else if(route.page === "favorites") page = <FavoritesPage />;
  else if(route.page === "recent") page = <RecentPage />;
  else if(route.page === "settings") page = <SettingsPage />;
  else page = <HomePage />;

  return (
    <AppProvider>
      <div style={{ minHeight:"100vh", background:"var(--bg)" }}>
        <Header onMenu={()=>setDrawerOpen(true)} onSearch={()=>setSearchOpen(true)} onProfile={()=>setProfileOpen(true)} />
        {showCategoryNav && <CategoryNav active={activeCategory} />}
        <main>{page}</main>
        <Footer />
        <Drawer open={drawerOpen} onClose={()=>setDrawerOpen(false)} />
        <SearchModal open={searchOpen} onClose={()=>setSearchOpen(false)} />
        <ProfileMenu open={profileOpen} onClose={()=>setProfileOpen(false)} />
      </div>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
